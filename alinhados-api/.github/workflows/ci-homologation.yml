name: Pipeline 2 - Homologação (Release Candidate)

on:
  push:
    branches:
      - 'release/*'

jobs:
  check:
    name: Build & Test (Integração)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Checkout Contracts
        uses: actions/checkout@v4
        with:
          repository: ruppell-barber/alinhados-contracts
          path: .alinhados-contracts-temp
          token: ${{ secrets.PAT_TOKEN }}

      - name: Move Contracts Outside Workspace
        run: mv .alinhados-contracts-temp ../alinhados-contracts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Build
        run: npm run build

      - name: Run Integration Tests
        run: npm run test

