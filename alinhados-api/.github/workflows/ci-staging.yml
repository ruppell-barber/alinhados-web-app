name: Pipeline 1 - Staging (Integração Contínua)

on:
  push:
    branches:
      - develop

jobs:
  check:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Checkout Contracts
        uses: actions/checkout@v4
        with:
          repository: ruppell-barber/alinhados-contracts
          path: .alinhados-contracts-temp
          token: ${{ secrets.PAT_TOKEN }}

      - name: Move Contracts Outside Workspace
        run: mv .alinhados-contracts-temp ../alinhados-contracts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Linter Check
        run: npm run lint

      - name: Type Check & Build
        run: npm run build

      - name: Run Tests & Coverage (Smoke Tests)
        run: npm run test:cov

  schema-validation:
    name: Schema Validation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Checkout Contracts
        uses: actions/checkout@v4
        with:
          repository: ruppell-barber/alinhados-contracts
          path: .alinhados-contracts-temp
          token: ${{ secrets.PAT_TOKEN }}

      - name: Move Contracts Outside Workspace
        run: mv .alinhados-contracts-temp ../alinhados-contracts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Schema Tests
        run: npm run test:schemas

